[project]
name = "zip-service"
version = "0.1.0"
description = "Streaming HTTP API that zips uploaded files"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httptools>=0.6",
    "python-multipart>=0.0.20,<0.1",
    "pydantic-settings>=2.6,<3",
]

[dependency-groups]
dev = [
    "coverage>=7.10",
    "diff-cover>=9.2",
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
]

[tool.uv]
# A deployable service, not a library: uv manages dependencies only and never builds or
# installs this project. Code runs from the repository root (`python main.py`).
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Fast tests by default; `pytest -m slow` runs the integration suite (the last -m wins).
addopts = "-ra --strict-markers -m 'not slow'"
markers = ["slow: integration tests against a real server process"]
timeout = 180

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["main.py", "zip_service", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.coverage.run]
# Line coverage of the service code, including the server subprocess that integration
# tests start (`patch = ["subprocess"]`). Run with COVERAGE_FILE set to an absolute path,
# because that server runs in a temporary directory (see `make coverage`).
source = ["."]
# Leading `*`: relative patterns resolve against each process's working directory, and the
# server subprocess runs in a temporary one.
omit = ["*/tests/*", "*/.venv/*"]
parallel = true
patch = ["subprocess"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Informational only: coverage never fails the build (see README, "Coverage").
