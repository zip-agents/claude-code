[project]
name = "zip-service"
version = "0.1.0"
description = "Streaming HTTP API that zips uploaded files"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httptools>=0.6",
    "python-multipart>=0.0.20,<0.1",
    "pydantic-settings>=2.6,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zip_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fast tests by default; `pytest -m slow` runs the integration suite (the last -m wins).
addopts = "-ra --strict-markers -m 'not slow'"
markers = ["slow: integration tests against a real server process"]
timeout = 180

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
