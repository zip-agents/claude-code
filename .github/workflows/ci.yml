name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Superseded runs on the same branch/PR are cancelled; main and tags always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_VERSION: "0.8.0"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install (fails if uv.lock is out of date with pyproject.toml)
        run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test-fast:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  test-slow:
    name: Integration tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Absolute: the integration tests' server subprocess runs in a temporary directory.
      COVERAGE_FILE: ${{ github.workspace }}/.coverage
      COVERAGE_CORE: sysmon
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # diff-cover compares against the pull request's base branch
      - name: Install archive tools used to validate output
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unzip p7zip-full
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Run all tests under coverage (missing unzip/7z fails instead of skipping)
        run: uv run coverage run -m pytest -m "slow or not slow"
        env:
          REQUIRE_ZIP_TOOLS: "1"
      - name: Coverage report (informational)
        continue-on-error: true
        run: |
          uv run coverage combine -q
          uv run coverage xml -q
          uv run coverage report
          {
            echo "### Coverage"
            uv run coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Warn about changed lines without coverage
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          uv run diff-cover coverage.xml \
            --compare-branch="origin/${{ github.base_ref }}" \
            --format "markdown:diff-cover.md,json:diff-cover.json"
          {
            echo "### Coverage of changed lines"
            cat diff-cover.md
          } >> "$GITHUB_STEP_SUMMARY"
          # One warning annotation per run of uncovered changed lines. Never fails the job.
          uv run python - <<'PY'
          import json

          report = json.load(open("diff-cover.json"))
          for path, stats in report["src_stats"].items():
              lines = sorted(stats["violation_lines"])
              start = previous = None
              for line in [*lines, None]:
                  if start is not None and line != previous + 1:
                      print(
                          f"::warning file={path},line={start},endLine={previous},"
                          "title=Not covered by tests::Changed lines not executed by any test"
                      )
                      start = None
                  if line is not None and start is None:
                      start = line
                  previous = line
          PY

  image:
    name: Build, smoke-test and publish image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [lint, test-fast, test-slow]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: zip-service:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the probe (dev) image used by the smoke test
        run: make dev-image
      - name: Smoke-test the image
        run: ./scripts/smoke_test.sh zip-service:ci
        env:
          EXPECTED_GIT_SHA: ${{ github.sha }}
      - name: Image metadata
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
